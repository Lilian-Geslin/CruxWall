{% extends "base.html" %}
{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <h2>Connexion</h2>
        {% if error %}<p class="form-error">{{ error }}</p>{% endif %}
        <form method="POST" action="/login">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" required maxlength="254" autocomplete="email" placeholder="ton@email.com">
            </div>
            <div class="form-group">
                <label>Mot de passe</label>
                <input type="password" name="password" required maxlength="128" autocomplete="current-password" placeholder="••••••••">
            </div>
            <button type="submit" class="btn-primary btn-full">Se connecter</button>
        </form>
        <p class="auth-switch">Pas de compte ? <a href="/register">Créer un compte</a></p>
    </div>
</div>
{% endblock %}
